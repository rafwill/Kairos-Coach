# Solo declara los paquetes del repo para instalarlos en modo editable (`pip install -e . --no-deps`,
# lo hace setup.ps1 / setup.sh): así `agent` y `garmin_mcp` se importan desde cualquier carpeta.
# Las dependencias siguen en requirements.txt y requirements-dev.txt.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-coach"
version = "0.1.0"
description = "Kairos Coach: entrenador con datos de Garmin (host) y su servidor MCP (garmin_mcp)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["agent*", "garmin_mcp*"]

# Lint obligatorio (CI y pre-commit): solo las reglas que detectan fallos reales, hoy a cero. F = pyflakes
# (imports sin usar, nombres no definidos, variables muertas); E9 = errores de sintaxis. Fijadas aquí para que
# un cambio de versión de ruff no cambie las reglas. El resto, como informe: make lint-informe.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
